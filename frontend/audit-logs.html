<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Logları - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/style.css?v=nb-28" rel="stylesheet">
    <script src="js/theme.js?v=nb-28"></script>
    <script src="js/shell-boot.js?v=nb-28"></script>
</head>

<body> 
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="fw-bold mb-0 text-muted">Sistem Logları</h6>
                </div>
                <div class="mb-4">
                    <input type="text" id="aramaKutusu" class="form-control rounded-pill" placeholder="Detaylarda veya ID ile Ara...">
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-muted small text-uppercase">
                                <th class="user-select-none">Tarih</th>
                                <th class="user-select-none">Kullanıcı / IP</th>
                                <th class="user-select-none">İşlem Tipi</th>
                                <th class="user-select-none">Hedef Kayıt</th>
                                <th class="text-start" id="islemSutunuBasligi">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="logTablosuGövdesi">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationContainer" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Log Detay Modalı -->
    <div class="modal fade" id="logDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white border-bottom-0">
                    <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i> Log Detayı</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="logDetailBody">
                </div>
            </div>
        </div>
    </div>

    <!-- Kullanıcı Profili Modalı -->
    <div class="modal fade" id="userProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-bottom-0">
                    <h5 class="modal-title text-dark"><i class="bi bi-person-vcard me-2"></i>Kullanıcı Profili</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4" id="userProfileBody">
                    <div class="text-center mb-4">
                        <div class="display-1 text-primary mb-3"><i class="bi bi-person-circle"></i></div>
                        <h3 class="fw-bold" id="upmName">-</h3>
                        <p class="text-muted" id="upmEmail">-</p>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-shield-lock me-2 text-warning"></i>Yetki Rolü</span>
                            <span class="badge bg-dark rounded-pill text-uppercase" id="upmRole">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-calendar-check me-2 text-success"></i>Kayıt Tarihi</span>
                            <span id="upmDate">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-envelope-check me-2 text-info"></i>E-posta Onayı</span>
                            <span id="upmEmailStatus"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js?v=nb-28"></script>
    <script src="js/partials/sidebar.partial.js?v=nb-28"></script>
    <script src="js/partials/topbar.partial.js?v=nb-28"></script>
    <script src="js/partials/pagination.partial.js?v=nb-28"></script>
    <script src="js/security-utils.js?v=nb-28"></script>
    <script src="js/table-utils.js?v=nb-28"></script>
    <script src="js/config.js?v=nb-28"></script>
    <script src="js/modal-window.js?v=nb-28"></script>
    <script src="js/data-view-engine.js?v=nb-28"></script>
    <script src="js/audit-logs.js?v=nb-28"></script>
    <script src="js/auth.js?v=nb-28"></script>
</body>

</html>
