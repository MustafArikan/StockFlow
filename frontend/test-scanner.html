<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Hibrit Tarayıcı Test Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
        }
        .scanner-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        #reader {
            border: 2px dashed #cbd5e1 !important;
            border-radius: 12px;
            overflow: hidden;
            background-color: #fafafa;
            position: relative;
            min-height: 250px;
        }
        /* html5-qrcode video elementini ortala */
        #reader video {
            width: 100% !important;
            border-radius: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card scanner-card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">StockFlow Tarayıcı</h2>
                    <p class="text-muted small">Hibrit Barkod ve QR Kod Okuyucu Test Arayüzü</p>
                </div>

                <!-- Kamera Alanı -->
                <div id="reader" class="mb-4"></div>

                <!-- Sonuç Gösterim Alanı -->
                <div class="card bg-light border-0 p-3 mb-3 d-none" id="result-box">
                    <h6 class="fw-bold text-secondary mb-1">Okunan Kod İçeriği:</h6>
                    <div class="d-flex align-items-center justify-content-between">
                        <span class="fs-5 fw-bold text-success" id="result-text">-</span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="copyResult()">Kopyala</button>
                    </div>
                    <div class="mt-2 text-muted small">
                        Format: <span class="fw-semibold" id="result-format">Bilinmiyor</span>
                    </div>
                </div>

                <!-- Kontrol Butonları -->
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg" onclick="initScanner()">Kamerayı Başlat</button>
                    <button class="btn btn-danger" onclick="stopScanner()">Kamerayı Durdur</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Güvenilir ve Kararlı html5-qrcode Kütüphanesi (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
<!-- Bizim yazdığımız yardımcı tarayıcı kodları -->
<script src="js/scanner.js"></script>

<script>
    // Kamerayı başlatma fonksiyonu
    function initScanner() {
        document.getElementById('result-box').classList.add('d-none');
        
        // startScanner fonksiyonunu bizim scanner.js'den çağırıyoruz
        startScanner('reader', onScanSuccess, onScanError);
    }

    // Kod başarıyla okunduğunda tetiklenecek fonksiyon
    function onScanSuccess(decodedText, decodedResult) {
        console.log(`Kod Okundu: ${decodedText}`, decodedResult);
        
        document.getElementById('result-box').classList.remove('d-none');
        document.getElementById('result-text').innerText = decodedText;
        
        if (decodedResult && decodedResult.result && decodedResult.result.format) {
            document.getElementById('result-format').innerText = decodedResult.result.format.formatName;
        } else {
            document.getElementById('result-format').innerText = "Belirlenemedi";
        }
    }

    function onScanError(errorMessage) {
        // Tarama sırasındaki anlık okuma denemesi hataları (opsiyonel dinleme)
    }

    // Okunan kodu kopyalama
    function copyResult() {
        const text = document.getElementById('result-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Kod panoya kopyalandı!");
        });
    }
</script>
</body>
</html>
