<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rol ve Yetki Yönetimi - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/style.css?v=nb-28" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="js/theme.js?v=nb-28"></script>
    <script src="js/auth-check.js?v=nb-28"></script>
    <script src="js/shell-boot.js?v=nb-28"></script>

</head>
<body>  
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="row g-4">
            <!-- Sol Panel: Roller Listesi -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 d-flex flex-column roles-panel-height">
                    <div class="card-header bg-transparent border-bottom-0 pt-4 pb-0 px-4 flex-shrink-0 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0">Roller</h5>
                        <button id="btnYeniRol" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                            <i class="bi bi-shield-plus"></i> <span class="d-none d-md-inline ms-1">Yeni Rol</span>
                        </button>
                    </div>
                    <div class="card-body p-0 mt-3 flex-grow-1 overflow-y-auto" id="rolesListContainer">
                        <!-- Roller buraya dinamik eklenecek -->
                        <div class="text-center p-4 text-muted">Yükleniyor...</div>
                    </div>
                </div>
            </div>

            <!-- Sağ Panel: Seçili Rolün Yetkileri -->
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 flex-column d-none roles-panel-height" id="roleDetailsCard">
                    <div class="card-header bg-transparent border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-shrink-0">
                        <div>
                            <div class="d-flex align-items-center mb-1">
                                <h4 class="fw-bold mb-0 me-2" id="selectedRoleNameDisplay">Rol Adı</h4>
                                <span class="badge bg-secondary" id="selectedRoleUserCount">0 Kullanıcı</span>
                                <span class="badge bg-danger ms-2 d-none" id="selectedRoleSystemBadge">Sistem Rolü</span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-danger rounded-pill px-3" id="btnDeleteRole">Sil</button>
                            <button class="btn btn-primary rounded-pill px-4 shadow-sm" id="btnSavePermissions">Kaydet</button>
                        </div>
                    </div>
                    <div class="card-body p-4 bg-light rounded-bottom-4 flex-grow-1 overflow-y-auto">
                        <form id="roleForm">
                            <input type="hidden" id="roleId">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Rol Adı</label>
                                    <input type="text" class="form-control bg-white fw-bold" id="roleName" placeholder="Rol adını girin">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Rol Açıklaması</label>
                                    <input type="text" class="form-control bg-white" id="roleDescription" placeholder="Bu rol ne işe yarar?">
                                </div>
                            </div>

                            <h5 class="fw-bold mb-4 mt-5"><i class="bi bi-grid me-2 text-primary"></i>Modül Yetkileri</h5>
                            <div id="permissionsContainer" class="row g-3">
                                <!-- Yetki modülleri buraya dinamik gelecek -->
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card border-0 shadow-sm rounded-4 d-flex justify-content-center align-items-center bg-light roles-panel-height" id="emptySelectionCard">
                    <div class="text-center p-5">
                        <i class="bi bi-shield-lock text-muted empty-state-icon"></i>
                        <h5 class="mt-3 text-muted">Yetkilerini düzenlemek için sol taraftan bir rol seçin</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <!-- Yeni Rol Ekleme Modalı -->
    <div class="modal fade" id="newRoleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-light border-bottom-0 rounded-top-4 py-3">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="bi bi-shield-plus me-2 text-primary"></i> Yeni Rol Oluştur
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="newRoleForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Rol Adı <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="newRoleName" required placeholder="Örn: Pazarlama Uzmanı">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Açıklama</label>
                            <input type="text" class="form-control" id="newRoleDesc" placeholder="Kısa bir açıklama girin">
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4 me-2 fw-bold" data-bs-dismiss="modal">İptal</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow">Oluştur ve Yetkileri Düzenle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/partials/sidebar.partial.js?v=nb-28"></script>
    <script src="js/partials/topbar.partial.js?v=nb-28"></script>
    <script src="js/partials/pagination.partial.js?v=nb-28"></script>
    <script src="js/security-utils.js?v=nb-28"></script>
    <script src="js/table-utils.js?v=nb-28"></script>
    <script src="js/config.js?v=nb-28"></script>
    <script src="js/modal-window.js?v=nb-28"></script>
    <script src="js/alerts.js?v=nb-28"></script>
    <script src="js/auth.js?v=nb-28"></script>
    <script src="js/roles.js?v=nb-28"></script>
</body>
</html>
