<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Yönetimi - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css?v=mobile-v1" rel="stylesheet">
    <script src="js/theme.js"></script>
</head>
<body>  
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">Kullanıcı Yönetimi</h1>
                <p class="text-muted mb-0">Sistem personellerini ve rollerini yönetin</p>
            </div>
            <button id="btnYeniKullanici" class="btn btn-primary rounded-pill px-4 shadow-sm d-none" data-bs-toggle="modal" data-bs-target="#kullaniciModal">
                <i class="bi bi-person-plus me-2"></i> Yeni Personel Ekle
            </button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-muted small text-uppercase">
                                <th>Ad Soyad</th>
                                <th>E-Posta</th>
                                <th>Telefon</th>
                                <th>Rol</th>
                                <th>Kayıt Tarihi</th>
                                <th class="text-end">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="kullaniciTablosuGovdesi">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="kullanicilarPaginationContainer" class="px-3 pb-3"></div>
            </div>
        </div>
    </div>

    <!-- Kullanıcı Ekle/Düzenle Modalı -->
    <div class="modal fade" id="kullaniciModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-light border-bottom-0 rounded-top-4 py-3">
                    <h5 class="modal-title fw-bold text-dark" id="modalBaslik">
                        <i class="bi bi-person-plus me-2 text-primary"></i> Yeni Kullanıcı
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="kullaniciFormu">
                        <input type="hidden" id="kullaniciId">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Ad <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Soyad <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">E-Posta <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Telefon</label>
                            <input type="text" class="form-control" id="phoneNumber">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Rol <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" required>
                                <option value="">Yükleniyor...</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold" id="passwordLabel">Şifre <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" minlength="8">
                            <small class="text-muted d-none" id="passwordHelp">Şifreyi değiştirmek istemiyorsanız boş bırakın.</small>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4 me-2 fw-bold" data-bs-dismiss="modal">İptal</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow">Kaydet</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Kullanıcı Geçmişi (Log) Modalı -->
    <div class="modal fade" id="kullaniciGecmisModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-light border-bottom-0 rounded-top-4 py-3">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="bi bi-clock-history me-2 text-primary"></i> <span id="gecmisKullaniciAdSoyad"></span> İşlem Geçmişi
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered bg-white">
                            <thead class="table-light">
                                <tr>
                                    <th>Tarih</th>
                                    <th>İşlem Tipi</th>
                                    <th>Etkilenen Tablo/Kayıt</th>
                                    <th>IP Adresi</th>
                                    <th>Eski Değerler</th>
                                    <th>Yeni Değerler</th>
                                </tr>
                            </thead>
                            <tbody id="gecmisTabloGovdesi">
                                <tr><td colspan="6" class="text-center">Yükleniyor...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/partials/sidebar.partial.js"></script>
    <script src="js/partials/topbar.partial.js"></script>
    <script src="js/partials/pagination.partial.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
