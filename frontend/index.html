<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Paneli - StockFlow</title>

    <!-- Bootstrap 5 CSS dosyasını yükler -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- İkonları ve görsel simgeleri sayfaya dahil eder -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Arayüzdeki metinler için Inter yazı tipini çeker -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- İŞTE BURASI HAYAT KURTARAN YER: ?v=mobile-v1 sayesinde tarayıcı eski CSS'i unutup yenisini çekecek! -->
    <link href="css/style.css?v=nb-40" rel="stylesheet">
    
    <!-- Sayfa yüklenirken tema parlamasını önlemek için scripti en başta çalıştırır -->
    <script src="js/theme.js?v=nb-40"></script>

    <!-- Token kontrolünü sayfa yüklenmeden önce yap (CSP Uyumlu) -->
    <script src="js/auth-check.js?v=nb-40"></script>
    <script src="js/shell-boot.js?v=nb-40"></script>
</head>

<body>  
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="d-flex justify-content-end mb-3 px-2">
            <button id="btnExportPdf" class="btn btn-outline-danger btn-sm rounded-pill px-3 shadow-sm me-2">
                <i class="bi bi-file-earmark-pdf"></i> <span class="d-none d-md-inline ms-1">PDF İndir</span>
            </button>
            <button id="btnExportCsv" class="btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm">
                <i class="bi bi-file-earmark-excel"></i> <span class="d-none d-md-inline ms-1">Excel İndir</span>
            </button>
        </div>

        <!-- PDF'e aktarılacak olan asıl dashboard alanını belirler -->
        <div id="dashboardExportArea">

            <!-- 4'lü Özet Bilgi Kartlarını listeler -->


            <div class="row g-4 mb-5">
                <!-- Ürün Çeşidi Kartı -->
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card saas-card border-0 shadow-sm rounded-4 p-4 h-100 position-relative">

                        <a href="products.html" class="stretched-link"></a>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted fw-bold stat-label">TOPLAM
                                ÜRÜN ÇEŞİDİ</span>
                            <i class="bi bi-box-seam text-primary fs-4"></i>
                        </div>
                        <h2 id="totalProductsText" class="fw-bold mb-0 stat-value-primary">0</h2>
                    </div>
                </div>

                <!-- Fiziksel Stok Kartı -->
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card saas-card border-0 shadow-sm rounded-4 p-4 h-100 position-relative">
                        <a href="movements.html" class="stretched-link"></a>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted fw-bold stat-label">TOPLAM
                                STOK</span>
                            <i class="bi bi-boxes text-success fs-4"></i>
                        </div>
                        <h2 id="totalStockText" class="fw-bold mb-0 text-success stat-value">0 <span
                                class="fs-6 text-muted">Adet</span></h2>
                    </div>
                </div>

                <!-- Aktif Depo Kartı -->
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card saas-card border-0 shadow-sm rounded-4 p-4 h-100 position-relative">
                        <a href="warehouses.html" class="stretched-link"></a>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted fw-bold stat-label">AKTİF
                                DEPO SAYISI</span>
                            <i class="bi bi-building text-info fs-4"></i>
                        </div>
                        <h2 id="activeWarehousesText" class="fw-bold mb-0 stat-value-primary">0</h2>
                    </div>
                </div>

                <!-- Kritik Stok Kartı -->
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card saas-card border-0 shadow-sm rounded-4 p-4 h-100 position-relative">
                        <a href="notifications.html" class="stretched-link"></a>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-danger fw-bold stat-label">KRİTİK
                                STOK UYARISI</span>
                            <i class="bi bi-exclamation-triangle-fill text-danger fs-4"></i>
                        </div>
                        <h2 id="criticalAlertsText" class="fw-bold text-danger mb-0 stat-value">0</h2>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <!-- Stok Hareket Trendi Çizgi Grafiği -->
                <div class="col-12 col-xl-8">
                    <div class="card border-0 shadow-sm rounded-3 p-4 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                            <h5 class="fw-bold text-muted mb-0 section-title-tight">STOK HAREKET TRENDİ</h5>
                            <select id="trendProductFilter" class="form-select form-select-sm w-auto shadow-sm border-secondary rounded-pill px-3 fw-bold text-primary">
                                <option value="" selected>Tümü (Genel Trend)</option>
                            </select>
                        </div>
                        <div class="custom-chart-wrapper trend-wrapper" id="trendWrapper">
                            <div class="trend-inner">
                                <canvas id="trendChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kategori Dağılımı Halka Grafiği -->
                <div class="col-12 col-xl-4">
                    <div class="card border-0 shadow-sm rounded-3 p-4 h-100">
                        <h5 class="fw-bold mb-3">Kategoriye Göre Dağılım</h5>
                        <div class="custom-chart-wrapper category-wrapper">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <!-- Hareket Özeti Pasta Grafiği -->
                <div class="col-12 col-xl-4">
                    <div class="card border-0 shadow-sm rounded-3 p-4 h-100">
                        <h5 class="fw-bold mb-3">Hareket Özeti</h5>
                        <div class="custom-chart-wrapper summary-wrapper">
                            <canvas id="movementSummaryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- En Çok Hareket Görenler Yatay Çubuk Grafiği -->
                <div class="col-12 col-xl-8">
                    <div class="card border-0 shadow-sm rounded-3 p-4 h-100">
                        <h5 class="fw-bold mb-3">En Çok Hareket Gören 7 Ürün</h5>
                        <div class="custom-chart-wrapper top-products-wrapper">
                            <canvas id="topProductsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hızlı işlem kısayollarını ekrana basar -->
        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm rounded-3 p-4">
                    <h4 class="fw-bold mb-3">Hızlı İşlemler</h4>
                    <div class="d-flex flex-wrap gap-3">
                        <a href="hybrid-scanner.html" class="btn btn-primary btn-lg rounded-pill px-4 shadow-sm">
                            Barkod/QR Okuyucu Aç
                        </a>
                        <a href="products.html" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                            Ürün Kataloğu
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sistem gereksinimleri olan dış kütüphaneleri yükler -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- Excel çıktılarına özel renk ve kenarlık verebilmek için gelişmiş sürümü yükler -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <!-- Uygulamanın kendi iş kurallarını barındıran scriptleri çalıştırır -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js?v=nb-40"></script>   
    <script src="js/partials/sidebar.partial.js?v=nb-40"></script>
    <script src="js/partials/topbar.partial.js?v=nb-40"></script>
    <script src="js/partials/pagination.partial.js?v=nb-40"></script>
    <script src="js/security-utils.js?v=nb-40"></script>
    <script src="js/table-utils.js?v=nb-40"></script>
    <script src="js/config.js?v=nb-40"></script>
    <script src="js/modal-window.js?v=nb-40"></script>
    <script src="js/auth.js?v=nb-40"></script>
    <script src="js/index.js?v=nb-40"></script>

</body>

</html>
