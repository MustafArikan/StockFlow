<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Envanter Takip - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="d-flex">
        <!-- Sidebar Placeholder -->
        <nav class="bg-secondary p-3 flex-column" style="min-width: 250px; min-height: 100vh;">
            <h4 class="text-center fw-bold mb-4 py-2 border-bottom">IT Stok Takip</h4>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link active fw-bold">Dashboard</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="products.html" class="nav-link text-white">Ürünler</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="movements.html" class="nav-link text-white">Stok Hareketleri</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="warehouses.html" class="nav-link text-white">Depolar</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="notifications.html" class="nav-link text-white">Bildirimler <span class="badge bg-danger" id="navBadge">0</span></a>
                </li>
                <li class="nav-item mb-2">
                    <a href="kanban.html" class="nav-link text-white">Kanban Paneli</a>
                </li>
            </ul>
            <div class="mt-auto border-top pt-3 text-center">
                <button onclick="auth.logout()" class="btn btn-outline-danger btn-sm w-100">Çıkış Yap</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4">Genel Özet Dashboard</h2>
            <!-- Cards summary -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card bg-secondary text-white border-0 shadow p-3 rounded-4">
                        <h6 class="text-light-50">Toplam Ürün Çeşidi</h6>
                        <h2 class="fw-bold mb-0" id="totalProducts">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-secondary text-white border-0 shadow p-3 rounded-4">
                        <h6 class="text-light-50">Kritik Stok Seviyesindeki Ürünler</h6>
                        <h2 class="fw-bold mb-0 text-danger" id="criticalStockCount">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-secondary text-white border-0 shadow p-3 rounded-4">
                        <h6 class="text-light-50">Toplam Depo Sayısı</h6>
                        <h2 class="fw-bold mb-0" id="totalWarehouses">0</h2>
                    </div>
                </div>
            </div>
            
            <p class="text-light-50">Geçiş süreci sonrasında veri akış grafikleri bu ekranda görüntülenecektir.</p>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
