<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tedarikçiler - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/style.css?v=nb-40" rel="stylesheet">
    <script src="js/theme.js?v=nb-40"></script>
    <script src="js/shell-boot.js?v=nb-40"></script>
</head>

<body>
    <div class="container-fluid px-0 px-md-1 my-3">
        <div class="row g-2">
            <!-- SOL PANEL: FİLTRELER -->
            <div class="col-12 col-md-5 col-lg-4 col-xl-3">
                <div class="card border-0 shadow-sm rounded-3 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-primary me-2"></i>Filtreler</h6>
                        <button type="button" id="btnFiltreleriTemizle" class="btn btn-sm btn-link text-decoration-none text-muted p-0">Temizle</button>
                    </div>
                    <div class="card-body p-3 pt-2">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Hızlı Ara</label>
                            <div class="position-relative d-flex align-items-center">
                                <span class="position-absolute ms-3 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="aramaKutusu" class="form-control form-control-sm rounded-pill ps-5 pe-5 py-2 bg-light border-0" placeholder="Ad, Kişi, Tel, Vergi No...">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Sıralama</label>
                            <select id="siralamaTedarikci" class="form-select form-select-sm bg-light border-0 rounded-pill px-3">
                                <option value="TARIH_YENI">Tarih (Yeniden Eskiye)</option>
                                <option value="TARIH_ESKI">Tarih (Eskiden Yeniye)</option>
                                <option value="A_Z">Alfabetik (A-Z)</option>
                                <option value="Z_A">Alfabetik (Z-A)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SAĞ PANEL: LİSTE VE TABLO -->
            <div class="col-12 col-md-7 col-lg-8 col-xl-9">
                <div class="card border-0 shadow-sm rounded-3 min-vh-75 h-100">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h6 class="fw-bold mb-0 text-muted">Tedarikçi Listesi</h6>
                            <button class="btn btn-primary rounded-pill px-3 shadow-sm btn-sm fw-bold d-flex align-items-center gap-2"
                                data-bs-toggle="modal" data-bs-target="#tedarikciModal">
                                <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Yeni Ekle</span>
                            </button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 border-top">
                                <thead>
                                    <tr class="text-muted small text-uppercase">
                                        <th id='thId' class="user-select-none sortable-th py-3">Tarih ↕</th>
                                        <th id="thAd" class="user-select-none sortable-th py-3">Tedarikçi Adı ↕</th>
                                        <th class="user-select-none py-3">İlgili Kişi</th>
                                        <th class="user-select-none py-3">Telefon</th>
                                        <th class="user-select-none py-3">Vergi No</th>
                                        <th class="text-end py-3" id="islemSutunuBasligi">İşlem</th>
                                    </tr>
                                </thead>
                                <tbody id="tedarikciTablosuGovdesi">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted py-5">
                                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div> Yükleniyor...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="paginationContainer" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tedarikciModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3">
                    <h5 class="modal-title fw-bold" id="modalBaslik">Yeni Tedarikçi Ekle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="tedarikciFormu">
                        <input type="hidden" id="tedarikciId">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Tedarikçi Adı <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tedarikciAdi" placeholder="Örn: ABC Ltd. Şti." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">İlgili Kişi</label>
                            <input type="text" class="form-control" id="tedarikciIlgiliKisi" placeholder="Örn: Ad Soyad">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Telefon</label>
                                <input type="text" class="form-control" id="tedarikciTelefon" placeholder="Örn: 0555 555 55 55">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">E-posta</label>
                                <input type="text" class="form-control" id="tedarikciEposta" placeholder="Örn: info@abc.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Adres</label>
                            <textarea class="form-control" id="tedarikciAdres" rows="2" placeholder="Firma adresi..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Vergi No</label>
                            <input type="text" class="form-control" id="tedarikciVergiNo" placeholder="Örn: 1234567890">
                        </div>
                        <button type="button" id="btnTedarikciKaydet"
                            class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Ekle ve Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tedarikciUrunModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3">
                    <h5 class="modal-title fw-bold" id="tedarikciUrunModalBaslik">Tedarikçi Ürünleri</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-muted small text-uppercase">
                                <th>Ürün Adı</th>
                                <th>Barkod</th>
                                <th>Alış Fiyatı</th>
                            </tr>
                        </thead>
                        <tbody id="tedarikciUrunListesi">
                            <tr><td colspan="3" class="text-muted fst-italic">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js?v=nb-40"></script>
    <script src="js/partials/sidebar.partial.js?v=nb-40"></script>
    <script src="js/partials/topbar.partial.js?v=nb-40"></script>
    <script src="js/partials/pagination.partial.js?v=nb-40"></script>
    <script src="js/security-utils.js?v=nb-40"></script>
    <script src="js/table-utils.js?v=nb-40"></script>
    <script src="js/config.js?v=nb-40"></script>
    <script src="js/modal-window.js?v=nb-40"></script>
    <script src="js/auth.js?v=nb-40"></script>
    <script src="js/partials/product-detail-modal.partial.js?v=nb-40"></script>
    <script src="js/partials/packaging-detail-modal.partial.js?v=nb-40"></script>
    <script src="js/product-detail.js?v=nb-40"></script>
    <script src="js/data-view-engine.js?v=nb-40"></script>
    <script src="js/suppliers.js?v=nb-40"></script>
</body>

</html>
