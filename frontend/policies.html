<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yetki Politikaları (Rate Limiting) - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/style.css?v=nb-40" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="js/theme.js?v=nb-40"></script>
    <script src="js/auth-check.js?v=nb-40"></script>
    <script src="js/shell-boot.js?v=nb-40"></script>

</head>
<body>  
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="row g-4">
            <!-- Sol Panel: Politikalar Listesi -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 d-flex flex-column roles-panel-height">
                    <div class="card-header bg-transparent border-bottom-0 pt-4 pb-0 px-4 flex-shrink-0">
                        <h5 class="fw-bold mb-0">Politikalar</h5>
                    </div>
                    <div class="card-body p-0 mt-3 flex-grow-1 overflow-y-auto" id="policiesListContainer">
                        <div class="text-center p-4 text-muted">Yükleniyor...</div>
                    </div>
                </div>
            </div>

            <!-- Sağ Panel: Seçili Politika Detayları -->
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 flex-column d-none roles-panel-height" id="policyDetailsCard">
                    <div class="card-header bg-transparent border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-shrink-0">
                        <div>
                            <div class="d-flex align-items-center mb-1">
                                <h4 class="fw-bold mb-0 me-2" id="selectedPolicyKeyDisplay">PolicyKey</h4>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary rounded-pill px-4 shadow-sm" id="btnSavePolicy">Kaydet</button>
                        </div>
                    </div>
                    <div class="card-body p-4 bg-light rounded-bottom-4 flex-grow-1 overflow-y-auto">
                        <form id="policyForm">
                            <input type="hidden" id="policyId">
                            
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Politika Anahtarı (Sabit)</label>
                                <input type="text" class="form-control bg-white fw-bold text-muted" id="policyKey" disabled>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Açıklama</label>
                                <input type="text" class="form-control bg-white" id="policyDescription" placeholder="Politika açıklaması">
                            </div>

                            <h5 class="fw-bold mb-3 mt-4"><i class="bi bi-speedometer2 me-2 text-warning"></i>Rate Limit Ayarları</h5>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">İstek Limiti (Kişi Başı)</label>
                                    <input type="number" class="form-control bg-white" id="policyPermitLimit" placeholder="Örn: 30">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Zaman Penceresi (Saniye)</label>
                                    <input type="number" class="form-control bg-white" id="policyWindowSeconds" placeholder="Örn: 60">
                                </div>
                                <div class="col-12 mt-2">
                                    <small class="text-danger"><i class="bi bi-info-circle me-1"></i>Uyarı: Rate Limit (İstek Limiti/Zaman) değişikliklerinin aktif olması için arka uç (backend) servisinin yeniden başlatılması gerekir.</small>
                                </div>
                            </div>

                            <h5 class="fw-bold mb-4 mt-5"><i class="bi bi-grid me-2 text-primary"></i>Politikaya Bağlı Yetkiler</h5>
                            <div id="permissionsContainer" class="row g-3">
                                <!-- Yetki modülleri buraya dinamik gelecek -->
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card border-0 shadow-sm rounded-4 d-flex justify-content-center align-items-center bg-light roles-panel-height" id="emptySelectionCard">
                    <div class="text-center p-5">
                        <i class="bi bi-shield-lock text-muted empty-state-icon"></i>
                        <h5 class="mt-3 text-muted">Ayarları düzenlemek için sol taraftan bir politika seçin</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/partials/sidebar.partial.js?v=nb-40"></script>
    <script src="js/partials/topbar.partial.js?v=nb-40"></script>
    <script src="js/security-utils.js?v=nb-40"></script>
    <script src="js/table-utils.js?v=nb-40"></script>
    <script src="js/config.js?v=nb-40"></script>
    <script src="js/modal-window.js?v=nb-40"></script>
    <script src="js/alerts.js?v=nb-40"></script>
    <script src="js/auth.js?v=nb-40"></script>
    <script src="js/policies.js?v=nb-40"></script>
</body>
</html>
