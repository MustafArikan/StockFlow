<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Hareketleri - StockFlow</title>

    <!-- Sayfa stil ve ikon kütüphanelerini yükler -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css?v=mobile-v1" rel="stylesheet">
    <script src="js/theme.js"></script>
</head>

<body>
    <!-- Ana içerik alanını oluşturur -->
    <div class="container my-5">

        <!-- Sayfa başlığı ve yeni işlem butonunu hizalar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">Stok Hareketleri</h1>
                <p class="text-muted mb-0">Ürün giriş ve çıkış kayıtları</p>
            </div>
            <button id="btnYeniIslem" class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal"
                data-bs-target="#stokIslemModal">
                + Yeni İşlem Ekle
            </button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 pt-2">

                <!-- Arama ve filtreleme alanlarını oluşturur -->
                <div class="row mb-4 align-items-center mt-3">
                    <div class="col-md-4">
                        <div class="position-relative">
                            <span class="position-absolute top-50 translate-middle-y ms-3 text-muted pointer-events-none">🔍</span>
                            <input type="text" id="aramaKutusu" class="form-control rounded-pill ps-5" placeholder="Ürün Adı, Kodu veya Personel Ara...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <input type="date" id="startDate" class="form-control rounded-pill" title="Başlangıç Tarihi">
                    </div>
                    <div class="col-md-3">
                        <input type="date" id="endDate" class="form-control rounded-pill" title="Bitiş Tarihi">
                    </div>
                    <div class="col-md-2 mt-3 mt-md-0 d-flex justify-content-md-end">
                        <button id="filtreUygula" class="btn btn-primary rounded-pill w-100 shadow-sm">Filtrele</button>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-12 d-flex gap-2 justify-content-md-end">
                        <button id="btnTumu" class="btn btn-secondary btn-sm rounded-pill px-3 shadow-sm filtre-elemani">Tümü</button>
                        <button id="btnGirisler" class="btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm filtre-elemani">Stok Girişleri</button>
                        <button id="btnCikislar" class="btn btn-outline-danger btn-sm rounded-pill px-3 shadow-sm filtre-elemani">Stok Çıkışları</button>
                        <button id="btnTransferler" class="btn btn-outline-info btn-sm rounded-pill px-3 shadow-sm filtre-elemani">Stok Transferleri</button>
                    </div>
                </div>
               
                <!-- Stok hareketlerini listeleyen tabloyu tanımlar -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 min-w-700">
                        <thead>
                            <tr class="text-muted small text-uppercase">
                                <th id="tarihBaslik" class="text-center user-select-none sortable-th">Tarih ↕</th>
                                <th id="thUrunKodu" class="text-center d-none d-md-table-cell user-select-none sortable-th">Ürün Kodu ↕</th>
                                <th id="thUrunAdi" class="user-select-none sortable-th">Ürün Adı ↕
                                </th>
                                <th id="thIslemTipi" class="text-center user-select-none sortable-th">İşlem Tipi ↕</th>
                                <th id="thAdet" class="text-center user-select-none sortable-th">
                                    Adet ↕</th>
                                <th id="thPersonel" class="text-center user-select-none sortable-th">Personel ↕</th>
                            </tr>
                        </thead>
                        <tbody id="stokHareketleriGovdesi"></tbody>
                    </table>
                </div>

                <!-- Sayfalama butonlarını barındırır -->
                <div id="hareketSayfalamaContainer"></div>
            </div>
        </div>
    </div>

    <!-- Yeni stok işlemi eklemek için kullanılan modalı (açılır pencere) tanımlar -->
    <div class="modal fade" id="stokIslemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3">
                    <h5 class="modal-title fw-bold" id="modalBaslik">Yeni Stok İşlemi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <form id="stokIslemFormu">
                        <input type="hidden" id="hareketId">

                        <!-- 1. ADIM: İşlem tipini belirler -->
                        <div class="mb-4 bg-white p-3 border rounded-3 shadow-sm">
                            <label class="form-label text-muted small fw-bold">1. İşlem Tipi Seçin</label>
                            <select class="form-select rounded-3 border-secondary" id="islemTipi" required>
                                <option value="" selected disabled>Lütfen işlem tipi seçiniz...</option>
                                <option value="GIRIS">Stok Girişi (Tedarik)</option>
                                <option value="CIKIS">Stok Çıkışı (Satış/Kullanım)</option>
                                <option value="TRANSFER">Stok Transferi (Depo/Raf Arası)</option>
                            </select>
                        </div>

                        <!-- 2. ADIM: Ürün seçimini ve barkod okuma alanını içerir -->
                        <div class="mb-4 p-3 bg-white border rounded-3 shadow-sm">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label text-muted small fw-bold mb-0">2. İşlem Yapılacak Ürün</label>
                                <button type="button"
                                    class="btn btn-sm btn-outline-primary rounded-pill py-0 px-3 fw-bold"
                                    id="btnKameraAc">
                                    <i class="bi bi-upc-scan me-1"></i> Barkod Okut
                                </button>
                            </div>                         

                            <div id="kameraAlani" class="d-none mb-3 rounded-3 overflow-hidden position-relative">
                                <div id="reader"></div>
                                <button type="button"
                                    class="btn btn-sm btn-danger position-absolute bottom-0 start-50 translate-middle-x mb-2 rounded-pill px-4 shadow camera-close-btn"
                                    id="btnKameraKapat">Kapat</button>
                            </div>
                            <select class="form-select" id="urunSecimi" required>
                                <option value="" selected disabled>Yükleniyor...</option>
                            </select>
                        </div>

                        <!-- 3. ADIM: Kaynak lokasyon alanını gösterir -->
                        <div class="mb-4 d-none p-3 bg-white border rounded-3 shadow-sm" id="sourceLocationGroup">
                            <h6 class="fw-bold text-danger mb-3"><i class="bi bi-box-arrow-up me-2"></i>3. Çıkış
                                (Kaynak) Konumu</h6>
                            <label class="form-label text-muted small fw-bold">Depo Seçin</label>
                            <select class="form-select mb-2" id="sourceWarehouseId">
                                <option value="">Seçiniz...</option>
                            </select>
                            <label class="form-label text-muted small fw-bold">Raf Seçin</label>
                            <select class="form-select" id="sourceLocationId" disabled>
                                <option value="">Önce depo seçin...</option>
                            </select>
                        </div>

                        <!-- 3. ADIM: Hedef lokasyon alanını gösterir -->
                        <div class="mb-4 d-none p-3 bg-white border rounded-3 shadow-sm" id="targetLocationGroup">
                            <h6 class="fw-bold text-success mb-3"><i class="bi bi-box-arrow-in-down me-2"></i>3. Giriş
                                (Hedef) Konumu</h6>
                            <label class="form-label text-muted small fw-bold">Depo Seçin</label>
                            <select class="form-select mb-2" id="targetWarehouseId">
                                <option value="">Seçiniz...</option>
                            </select>
                            <label class="form-label text-muted small fw-bold">Raf Seçin</label>
                            <select class="form-select" id="targetLocationId" disabled>
                                <option value="">Önce depo seçin...</option>
                            </select>
                        </div>

                        <!-- EK BİLGİLER (OPSİYONEL) alanını gösterir -->
                        <div class="mb-4 p-3 bg-white border rounded-3 shadow-sm">
                            <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-info-circle me-2"></i>Ek Bilgiler
                                (Opsiyonel)</h6>

                            <div class="mb-3 d-none" id="tedarikciGroup">
                                <label class="form-label text-muted small fw-bold">Tedarikçi</label>
                                <select class="form-select" id="tedarikciSecimi">
                                    <option value="" selected disabled>Tedarikçi yükleniyor...</option>
                                </select>
                            </div>
                            <div class="mb-3 d-none" id="cikisNoktasiGroup">
                                <label class="form-label text-muted small fw-bold">Çıkış/Teslim Noktası</label>
                                <input type="text" class="form-control" id="cikisNoktasi"
                                    placeholder="Örn: Müşteri Adı, Şantiye vb.">
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Birim Fiyat</label>
                                    <input type="number" step="0.01" class="form-control" id="birimFiyat"
                                        placeholder="Örn: 150.50">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Fatura/İrsaliye No</label>
                                    <input type="text" class="form-control" id="faturaNo"
                                        placeholder="Örn: FAT-2023-001">
                                </div>
                            </div>
                        </div>

                        <!-- 4. ADIM: Miktar girişi alanını barındırır -->
                        <div class="mb-4 p-3 bg-white border rounded-3 shadow-sm">
                            <label class="form-label text-muted small fw-bold">4. İşlem Adedi (Max: 100.000)</label>
                            <input type="number" class="form-control" id="islemAdedi" placeholder="Örn: 10" min="1"
                                max="100000" required>
                        </div>

                        <button type="submit" id="btnKaydet"
                            class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm" disabled>İşlemi Onayla ve
                            Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Kullanıcı profilini gösteren açılır pencereyi tanımlar -->
    <div class="modal fade" id="userProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-bottom-0">
                    <h5 class="modal-title text-dark"><i class="bi bi-person-vcard me-2"></i>Kullanıcı Profili</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4" id="userProfileBody">
                    <div class="text-center mb-4">
                        <div class="display-1 text-primary mb-3"><i class="bi bi-person-circle"></i></div>
                        <h3 class="fw-bold" id="upmName">-</h3>
                        <p class="text-muted" id="upmEmail">-</p>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-shield-lock me-2 text-warning"></i>Yetki Rolü</span>
                            <span class="badge bg-dark rounded-pill text-uppercase" id="upmRole">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-calendar-check me-2 text-success"></i>Kayıt Tarihi</span>
                            <span id="upmDate">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-envelope-check me-2 text-info"></i>E-posta Onayı</span>
                            <span id="upmEmailStatus"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Gerekli kütüphaneleri ve sayfa scriptlerini yükler -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>    
    <script src="js/partials/sidebar.partial.js"></script>
    <script src="js/partials/topbar.partial.js"></script>
    <script src="js/partials/pagination.partial.js"></script>
    <script src="js/security-utils.js"></script>
    <script src="js/table-utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data-view-engine.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/movements.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
