<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Hareketleri - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                Stock<span class="text-white">Flow</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Ürünler</a></li>
                    <li class="nav-item"><a class="nav-link active" href="movements.html">Stok Hareketleri</a></li>
                    <li class="nav-item"><a class="nav-link" href="warehouses.html">Depolar</a></li>
                    <li class="nav-item"><a class="nav-link" href="test-scanner.html">Barkod Okuyucu</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-0">Stok Hareketleri</h2>
                <p class="text-muted small mb-0">Donanım giriş ve çıkış logları</p>
            </div>
            <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal"
                data-bs-target="#stokIslemModal">
                + Yeni İşlem Ekle
            </button>
        </div>

        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
            <div class="row mb-4 align-items-center">

                <div class="col-md-6">
                    <div class="position-relative">
                        <span class="position-absolute top-50 translate-middle-y ms-3 text-muted"
                            style="pointer-events: none; z-index: 10;">🔍</span>
                        <input type="text" id="aramaKutusu" class="form-control rounded-pill ps-5"
                            placeholder="Ürün Adı, Kodu veya Personel Ara...">
                    </div>
                </div>

                <div class="col-md-6 text-md-end mt-3 mt-md-0 d-flex gap-2 justify-content-md-end">
                    <button id="btnTumu" class="btn btn-dark btn-sm rounded-pill px-3">Tümü</button>
                    <button id="btnGirisler" class="btn btn-outline-success btn-sm rounded-pill px-3">Stok
                        Girişleri</button>
                    <button id="btnCikislar" class="btn btn-outline-danger btn-sm rounded-pill px-3">Stok
                        Çıkışları</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="text-secondary small fw-semibold">Tarih</th>
                            <th class="text-secondary small fw-semibold">Ürün Kodu</th>
                            <th class="text-secondary small fw-semibold">Donanım Adı</th>
                            <th class="text-secondary small fw-semibold">İşlem Tipi</th>
                            <th class="text-secondary small fw-semibold">Adet</th>
                            <th class="text-secondary small fw-semibold">Personel</th>
                            <th class="text-secondary small fw-semibold text-end">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="hareketTablosuGövdesi">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="stokIslemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 bg-light rounded-top-3">
                    <h5 class="modal-title fw-bold text-dark" id="modalBaslik">Yeni Stok İşlemi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="stokIslemFormu">
                        <input type="hidden" id="hareketId">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">İşlem Tipi</label>
                            <select class="form-select border-light-subtle" id="islemTipi">
                                <option value="GIRIS">Stok Girişi (Tedarik)</option>
                                <option value="CIKIS">Stok Çıkışı (Satış/Kullanım)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Donanım Seçin</label>
                            <select class="form-select border-light-subtle" id="urunSecimi">
                                <option value="VGA-4090">NVIDIA GeForce RTX 4090 24GB</option>
                                <option value="CPU-7800">AMD Ryzen 7 7800X3D İşlemci</option>
                                <option value="RAM-C32">Corsair Vengeance 32GB DDR5</option>
                                <option value="SSD-1TB">Samsung 990 PRO 1TB M.2</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">İşlem Adedi</label>
                            <input type="number" class="form-control border-light-subtle" id="islemAdedi"
                                placeholder="Örn: 10" min="1">
                        </div>
                        <button type="button" id="btnKaydet"
                            class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Ekle ve Onayla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/movements.js"></script>
</body>

</html>
