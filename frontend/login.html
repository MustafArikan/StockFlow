<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Envanter Takip - Giriş Yap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container" style="max-width: 450px;">
        <div class="card bg-secondary text-white border-0 shadow rounded-4 p-4">
            <div class="text-center mb-4">
                <div class="d-inline-block bg-primary p-3 rounded-4 mb-3 shadow-sm">
                    <!-- Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-box-seam-fill text-white" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M15.528 2.973a.75.75 0 0 1 .472.696v8.662a.75.75 0 0 1-.472.696l-7.25 2.9a.75.75 0 0 1-.557 0l-7.25-2.9A.75.75 0 0 1 0 12.331V3.669a.75.75 0 0 1 .471-.696L7.443.184a.75.75 0 0 1 .513 0zm-1.358 2.03L8.4 7.662v6.503l5.77-2.308V5.002z"/>
                    </svg>
                </div>
                <h3 class="fw-bold">IT Stok Portalı</h3>
                <p class="text-light-50 text-sm">Deva IT Envanter Takip Portalı</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-light-50">E-posta Adresi</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary rounded-3" id="email" required placeholder="name@godeva.com.tr">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-light-50">Şifre</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary rounded-3" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-full py-2 rounded-3 fw-bold">Giriş Yap</button>
            </form>
            
            <div class="mt-4 pt-3 border-top border-secondary text-center text-light-50" style="font-size: 0.8rem;">
                <p class="mb-1">Varsayılan Test Hesapları:</p>
                <p class="mb-0">Yönetici: admin@godeva.com.tr / KurumsalSifre123!</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
