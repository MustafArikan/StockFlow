<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - StockFlow</title>
    <!-- Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Inter)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Özel Tema CSS'imiz -->
    <link href="css/style.css?v=nb-28" rel="stylesheet">   
    <script src="js/theme.js?v=nb-28"></script>

</head>
<body class="auth-page-body">  

    <span class="auth-code-note">// oturum aç<br>// stok, depo ve ekipman yönetimi</span>

    <div class="auth-shell">
        <div class="auth-brand">
            <span class="auth-brand-mark"><i class="bi bi-hexagon-fill"></i></span>
            <span class="auth-brand-text">Stock<span>Flow</span></span>
        </div>

        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h1 class="auth-title">Tekrar hoş geldiniz</h1>
                    <p class="auth-subtitle">Hesabınıza giriş yapın</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresi</label>
                        <input type="email" class="form-control" id="email" required placeholder="ornek@sirket.com">
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label mb-0">Şifre</label>
                            <a href="forgot-password.html" class="auth-inline-link">Şifremi Unuttum</a>
                        </div>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" required placeholder="••••••••">
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-auth-cta w-100" id="btnLogin">
                        Giriş Yap
                    </button>
                </form>
            </div>
        </div>

        <p class="auth-foot">Hesabınız yok mu? <a href="register.html">Kayıt Ol →</a></p>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js?v=nb-28"></script>    
    <script src="js/security-utils.js?v=nb-28"></script>
    <script src="js/table-utils.js?v=nb-28"></script>
    <script src="js/config.js?v=nb-28"></script>
    <script src="js/login.js?v=nb-28"></script>
</body>
</html>
