<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - StockFlow</title>
    <!-- Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Inter)-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Özel Tema CSS'imiz -->
    <link href="css/style.css" rel="stylesheet">    
    <script src="js/theme.js"></script>
    <style>
        body {
            background-color: var(--bg-primary);            
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            border-radius: 1rem;
        }
    </style>
</head>
<body>  

    <div class="card auth-card border-0 shadow-lg bg-white">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <a class="navbar-brand fw-bold text-primary fs-3 text-decoration-none" href="#">
                    Stock<span class="">Flow</span>    
                </a>
                <p class="text-muted mt-2">Hesabınıza giriş yapın</p>
            </div>

            <!-- Hata mesajı alanı -->
            <div id="errorMessage" class="alert alert-danger d-none small py-2" role="alert"></div>
            <!-- Başarı mesajı alanı -->
            <div id="successMessage" class="alert alert-success d-none small py-2" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small text-muted">E-posta Adresi</label>
                    <input type="email" class="form-control" id="email" required placeholder="ornek@sirket.com">
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label fw-bold small text-muted mb-0">Şifre</label>
                        <a href="forgot-password.html" class="small fw-bold text-decoration-none">Şifremi Unuttum</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" required placeholder="••••••••">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnLogin">
                    Giriş Yap
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="mb-0 small text-muted">Hesabınız yok mu? <a href="register.html" class="text-primary fw-bold text-decoration-none">Kayıt Ol</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
