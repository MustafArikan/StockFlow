<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik Bildirimler - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons kullanarak zil, kilit ve ünlem simgelerini getireceğiz -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/theme.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .alert-border-warning { border-left: 5px solid #ffc107 !important; }  /* Sarı */
        .alert-border-critical { border-left: 5px solid #fd7e14 !important; }  /* Turuncu */ 
        .alert-border-danger { border-left: 5px solid #dc3545 !important; }  /* Kırmızı */

        .notification-card {
            transition: all 0.2s ease;
            background-color: var(--bs-body-bg); /* Temaya göre otomatik arkaplan alır */
        }
        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>
<body>  

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                Stock<span class="text-white">Flow</span>    
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menüyü Aç/Kapat">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Kategoriler</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Ürünler</a></li>
                    <li class="nav-item"><a class="nav-link" href="movements.html">Stok Hareketleri</a></li>
                    <li class="nav-item"><a class="nav-link" href="warehouses.html">Depolar</a></li>
                    <li class="nav-item"><a class="nav-link" href="suppliers.html">Tedarikçiler</a></li>
                    <li class="nav-item"><a class="nav-link" href="audit-logs.html">Sistem Logları</a></li>
                    <li class="nav-item"><a class="nav-link" href="test-scanner.html">Barkod Okuyucu</a></li>
                    <li class="nav-item d-none" id="navUsersItem"><a class="nav-link" href="users.html">Kullanıcılar</a></li>
                </ul>
                <!-- Sağ tarafa kullanıcı profil bilgilerini göstereceğimiz bir alan -->
                <div class="d-flex align-items-center text-white-50">
                    <button id="themeToggleBtn" class="theme-toggle-btn border-0 me-3 text-white-50" title="Temayı Değiştir"></button>
                    <a href="profile.html" id="userProfile" class="me-3 small fw-bold text-white-50 text-decoration-none border border-secondary rounded-pill px-3 py-1 bg-dark bg-opacity-25" title="Profil Ayarları"></a>

                </div>
            </div>
        </div>
    </nav>
    
    <div class="container my-5">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3" style="background: transparent;">
                <div>
                    <h2 class="fw-bold mb-0">Bildirim Paneli</h2>
                    <p class="text-muted small mb-0">Sistem uyarıları ve kritik stok seviyeleri</p>
                </div>
                <button id="btnMarkAllAsRead" class="btn btn-outline-primary rounded-pill px-4 shadow-sm fw-bold btn-sm">
                    <i class="bi bi-check-all"></i> Tümünü Okundu İşaretle
                </button>
            </div>

            <div class="card-body p-4">
                <div class="mb-4 d-flex gap-2">
                    <button id="btnFilterAll" class="btn btn-primary btn-sm rounded-pill px-3">Tümü</button>
                    <button id="btnFilterUnread" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Sadece Okunmamış</button>
                </div> 

                <div id="notificationList" class="d-flex flex-column gap-3">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
