<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik Bildirimler - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons kullanarak zil, kilit ve ünlem simgelerini getireceğiz -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css?v=mobile-v1" rel="stylesheet">
    <script src="js/theme.js"></script>

</head>

<body class="notifications-page-body">
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h6 class="fw-bold mb-0 text-muted">Bildirim Paneli</h6>
                    <button id="btnMarkAllAsRead" class="btn btn-outline-primary btn-sm rounded-pill px-3 shadow-sm fw-bold">
                        <i class="bi bi-check-all"></i> <span class="d-none d-md-inline ms-1">Tümünü Okundu İşaretle</span>
                    </button>
                </div>
                <div class="mb-4 d-flex gap-2">
                    <button id="btnFilterAll" class="btn btn-primary btn-sm rounded-pill px-3">Tümü</button>
                    <button id="btnFilterUnread" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Sadece Okunmamış</button>
                </div> 

                <div id="notificationList" class="d-flex flex-column gap-3">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>    
    <script src="js/partials/sidebar.partial.js"></script>
    <script src="js/partials/topbar.partial.js"></script>
    <script src="js/partials/pagination.partial.js"></script>
    <script src="js/security-utils.js"></script>
    <script src="js/table-utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>

</body>
</html>
