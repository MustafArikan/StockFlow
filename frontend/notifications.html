<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik Bildirimler - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons kullanarak zil, kilit ve ünlem simgelerini getireceğiz -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/theme.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .alert-border-warning { border-left: 5px solid #ffc107 !important; }  /* Sarı */
        .alert-border-critical { border-left: 5px solid #fd7e14 !important; }  /* Turuncu */ 
        .alert-border-danger { border-left: 5px solid #dc3545 !important; }  /* Kırmızı */

        .notification-card {
            transition: all 0.2s ease;
            background-color: var(--bs-body-bg); /* Temaya göre otomatik arkaplan alır */
        }
        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3" style="background: transparent;">
                <div>
                    <h2 class="fw-bold mb-0">Bildirim Paneli</h2>
                    <p class="text-muted small mb-0">Sistem uyarıları ve kritik stok seviyeleri</p>
                </div>
                <button id="btnMarkAllAsRead" class="btn btn-outline-primary rounded-pill px-4 shadow-sm fw-bold btn-sm">
                    <i class="bi bi-check-all"></i> Tümünü Okundu İşaretle
                </button>
            </div>

            <div class="card-body p-4">
                <div class="mb-4 d-flex gap-2">
                    <button id="btnFilterAll" class="btn btn-primary btn-sm rounded-pill px-3">Tümü</button>
                    <button id="btnFilterUnread" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Sadece Okunmamış</button>
                </div> 

                <div id="notificationList" class="d-flex flex-column gap-3">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>

</body>
</html>
