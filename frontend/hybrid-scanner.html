<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Hibrit Tarayıcı Test Paneli</title>
    <!-- Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Özel Tema CSS'imiz -->
    <link href="css/style.css?v=nb-28" rel="stylesheet">
    <!-- SweetAlert2 CSS (W3C standardı gereği head içine alındı) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Tema Yönetim Script'i -->
    <script src="js/theme.js?v=nb-28"></script>
    <!-- Token ve Oturum Kontrolü -->
    <script src="js/auth-check.js?v=nb-28"></script>
    <script src="js/shell-boot.js?v=nb-28"></script>
</head>

<body>

    <!-- Projenin ortak layout mimarisine (Sidebar & Topbar) uyumlu olması için ana kapsayıcı eklendi -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card scanner-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">StockFlow Tarayıcı</h2>
                        <p class="text-muted small">Hibrit Barkod ve QR Kod Okuyucu Test Arayüzü</p>
                    </div>

                    <!-- Kamera Alanı -->
                    <div id="reader" class="mb-4"></div>

                    <!-- Sonuç Gösterim Alanı -->
                    <div class="card bg-light border-0 p-3 mb-3 d-none" id="result-box">
                        <h6 class="fw-bold text-secondary mb-1">Okunan Kod İçeriği:</h6>
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="fs-5 fw-bold text-success" id="result-text">-</span>
                            <button id="btnCopyResult" class="btn btn-outline-secondary btn-sm">Kopyala</button>
                        </div>
                        <div class="mt-2 text-muted small">
                            Format: <span class="fw-semibold" id="result-format">Bilinmiyor</span>
                        </div>
                    </div>

                    <!-- Kontrol Butonları -->
                    <div class="d-grid gap-2">
                        <button id="btnStartScanner" class="btn btn-primary btn-lg">Kamerayı Başlat</button>
                        <button id="btnStopScanner" class="btn btn-danger d-none">Kamerayı Durdur</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- html5-qrcode Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
        type="text/javascript"></script>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

    <!-- Proje Scriptleri -->
    <script src="js/security-utils.js?v=nb-28"></script>
    <script src="js/table-utils.js?v=nb-28"></script>
    <script src="js/config.js?v=nb-28"></script>
    <script src="js/modal-window.js?v=nb-28"></script>
    <script src="js/alerts.js?v=nb-28"></script>
    <script src="js/auth.js?v=nb-28"></script>
    <script src="js/partials/sidebar.partial.js?v=nb-28"></script>
    <script src="js/partials/topbar.partial.js?v=nb-28"></script>
    <script src="js/partials/pagination.partial.js?v=nb-28"></script>
    <script src="js/scanner.js?v=nb-28"></script>
    <script src="js/hybrid-scanner.js?v=nb-28"></script>
</body>

</html>
