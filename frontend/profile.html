<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Ayarları - StockFlow</title>
    <!-- Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Inter)-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Özel Tema CSS'imiz -->
    <link href="css/style.css?v=mobile-v1" rel="stylesheet">
    <!-- Tema Yönetim Script'i -->
    <script src="js/theme.js"></script>
</head>
<body class="bg-light"> 
    <!-- ANA İÇERİK -->
    <div class="container py-5">
        <div class="row justify-content-center">
            
            <div class="col-12 mb-4">
                <h2 class="fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-person-gear text-primary"></i> Profil Ayarları
                </h2>
                <p class="text-muted">Kişisel bilgilerinizi ve güvenlik şifrenizi bu alandan güncelleyebilirsiniz.</p>
            </div>

            <!-- KİŞİSEL BİLGİLER KARTI -->
            <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold mb-0">Kişisel Bilgiler</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="profileForm">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label text-muted small fw-semibold">Adınız</label>
                                    <input type="text" class="form-control" id="profileFirstName" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label text-muted small fw-semibold">Soyadınız</label>
                                    <input type="text" class="form-control" id="profileLastName" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">E-Posta Adresiniz</label>
                                    <input type="email" class="form-control" id="profileEmail" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">Telefon Numarası</label>
                                    <input type="tel" class="form-control" id="profilePhone" placeholder="05XX XXX XX XX">
                                </div>
                                <div class="col-12 mt-4 text-end">
                                    <button type="submit" class="btn btn-primary px-4 rounded-pill" id="btnSaveProfile">
                                        <i class="bi bi-check2-circle me-1"></i> Bilgileri Kaydet
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ŞİFRE DEĞİŞTİRME KARTI -->
            <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold mb-0 text-danger"><i class="bi bi-shield-lock"></i> Güvenlik & Şifre</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="passwordForm">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">Mevcut Şifreniz</label>
                                    <input type="password" class="form-control" id="oldPassword" required minlength="8">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">Yeni Şifreniz</label>
                                    <input type="password" class="form-control" id="newPassword" required minlength="8">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">Yeni Şifreniz (Tekrar)</label>
                                    <input type="password" class="form-control" id="confirmNewPassword" required minlength="8">
                                    <div class="form-text text-danger d-none" id="passwordMatchError">Şifreler birbiriyle eşleşmiyor!</div>
                                </div>
                                <div class="col-12 mt-4 text-end">
                                    <button type="submit" class="btn btn-danger px-4 rounded-pill" id="btnChangePassword">
                                        <i class="bi bi-key me-1"></i> Şifreyi Değiştir
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS ve SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Merkezi API Ayarları ve Sayfa Kodumuz -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>

</body>
</html>
