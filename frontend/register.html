<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css?v=mobile-v1" rel="stylesheet"> 
    <script src="js/theme.js"></script>

</head>
<body class="auth-page-body">  

    <div class="card auth-card border-0 shadow-lg bg-white">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <a class="navbar-brand fw-bold text-primary fs-3 text-decoration-none" href="#">
                    Stock<span class="">Flow</span>    
                </a>
                <p class="text-muted mt-2" id="pageSubtitle">Yeni bir hesap oluşturun</p>
            </div>



            <!-- KAYIT FORMU -->
            <form id="registerForm">
                <div class="row mb-3">
                    <div class="col-6">
                        <label for="regFirstName" class="form-label fw-bold small text-muted">Ad</label>
                        <input type="text" class="form-control" id="regFirstName" required placeholder="Adınız">
                    </div>
                    <div class="col-6">
                        <label for="regLastName" class="form-label fw-bold small text-muted">Soyad</label>
                        <input type="text" class="form-control" id="regLastName" required placeholder="Soyadınız">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="regEmail" class="form-label fw-bold small text-muted">E-posta Adresi</label>
                    <input type="email" class="form-control" id="regEmail" required placeholder="ornek@sirket.com">
                </div>
                <div class="mb-4">
                    <label for="regPassword" class="form-label fw-bold small text-muted">Şifre</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="regPassword" required minlength="8"
                            placeholder="En az 8 karakter: büyük/küçük harf, rakam, özel karakter">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="regPassword">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <div id="regPasswordHint" class="form-text small">
                        Şifreniz en az 8 karakter olmalı; en az bir büyük harf, bir küçük harf, bir rakam ve bir özel karakter (örn. <code>!@#$%</code>) içermelidir.
                    </div>
                </div>
                <div class="mb-4">
                    <label for="regPasswordConfirm" class="form-label fw-bold small text-muted">Şifre (Tekrar)</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="regPasswordConfirm" required placeholder="Şifrenizi tekrar girin">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="regPasswordConfirm">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnRegister">
                    Kayıt Ol
                </button>
                <div class="text-center mt-4">
                    <p class="mb-0 small text-muted">Zaten hesabınız var mı? <a href="login.html" class="text-primary fw-bold text-decoration-none">Giriş Yap</a></p>
                </div>
            </form>

            <!-- DOĞRULAMA (VERIFY) FORMU (Başlangıçta Gizli) -->
            <form id="verifyForm" class="d-none">
                <p class="small text-muted text-center mb-4">
                    E-posta adresinize 6 haneli bir doğrulama kodu gönderildi. Lütfen kodu aşağıya girin.
                </p>
                <div class="mb-4">
                    <label for="verificationCode" class="form-label fw-bold small text-muted">Doğrulama Kodu</label>
                    <input type="text" class="form-control text-center fs-4 letter-spacing-lg" id="verificationCode" required placeholder="000000" maxlength="6">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnVerify">
                    <i class="bi bi-check-circle me-1"></i> Hesabı Onayla
                </button>
            </form>

        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/security-utils.js"></script>
    <script src="js/table-utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
