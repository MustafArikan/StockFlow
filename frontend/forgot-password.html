<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">    
    <script src="js/theme.js"></script>
    <style>
        body {
            background-color: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            border-radius: 1rem;
        }
    </style>
</head>
<body>  

    <div class="card auth-card border-0 shadow-lg bg-white">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <a class="navbar-brand fw-bold text-primary fs-3 text-decoration-none" href="#">
                    Stock<span class="">Flow</span>    
                </a>
                <p class="text-muted mt-2" id="pageSubtitle">Şifrenizi sıfırlayın</p>
            </div>

            <!-- Ortak Uyarı Mesajları -->
            <div id="alertMessage" class="alert d-none small py-2" role="alert"></div>

            <!-- E-POSTA İSTEME FORMU -->
            <form id="requestForm">
                <p class="small text-muted mb-4">
                    Kayıtlı e-posta adresinizi girin. Şifrenizi sıfırlamanız için size 6 haneli bir kod göndereceğiz.
                </p>
                <div class="mb-4">
                    <label for="resetEmail" class="form-label fw-bold small text-muted">E-posta Adresi</label>
                    <input type="email" class="form-control" id="resetEmail" required placeholder="ornek@sirket.com">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnRequest">
                    Kod Gönder
                </button>
                <div class="text-center mt-4">
                    <a href="login.html" class="text-secondary small fw-bold text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Giriş Ekranına Dön
                    </a>
                </div>
            </form>

            <!-- SIFIRLAMA KODU DOĞRULAMA FORMU (Başlangıçta Gizli) -->
            <form id="verifyCodeForm" class="d-none">
                <p class="small text-muted mb-4">
                    E-postanıza gönderilen 6 haneli doğrulama kodunu girin.
                </p>
                <div class="mb-4">
                    <label for="resetCode" class="form-label fw-bold small text-muted">Sıfırlama Kodu</label>
                    <input type="text" class="form-control text-center fs-4 letter-spacing-lg" id="resetCode" required placeholder="000000" maxlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnVerifyCode">
                    Kodu Doğrula
                </button>
            </form>

            <!-- YENİ ŞİFRE BELİRLEME FORMU (Başlangıçta Gizli) -->
            <form id="resetPasswordForm" class="d-none">
                <p class="small text-muted mb-4">
                    Kodu doğruladınız. Lütfen yeni şifrenizi belirleyin.
                </p>
                <div class="mb-4">
                    <label for="newPassword" class="form-label fw-bold small text-muted">Yeni Şifre</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="newPassword" required placeholder="En az 8 karakter, harf ve rakam">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="newPasswordConfirm" class="form-label fw-bold small text-muted">Yeni Şifre (Tekrar)</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="newPasswordConfirm" required placeholder="Yeni şifrenizi tekrar girin">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPasswordConfirm">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnResetPassword">
                    <i class="bi bi-check-circle me-1"></i> Şifreyi Yenile
                </button>
            </form>

        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
