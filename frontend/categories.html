<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategoriler - Stockflow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css?v=mobile-v1" rel="stylesheet">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="fw-bold mb-0 text-muted">Kategori Listesi</h6>
                    <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" data-bs-toggle="modal"
                        data-bs-target="#kategoriModal">+ <span class="d-none d-md-inline">Yeni Kategori Ekle</span></button>
                </div>

                <div class="mb-4">
                    <input type="text" id="aramaKutusu" class="form-control rounded-pill"
                        placeholder="Kategori Adı veya ID ile Ara...">
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-muted small text-uppercase">
                                <th id="thId" class="d-none">ID ↕</th>
                                <th id="thAd" class="cursor-pointer user-select-none">Kategori Adı ↕</th>
                                <th class="text-end" id="islemSutunuBasligi">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="kategoriTablosuGovdesi">
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4"> Yükleniyor... </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="kategoriModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3">
                    <h5 class="modal-title fw-bold" id="modalBaslik">Yeni Kategori Ekle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="kategoriFormu">
                        <input type="hidden" id="kategoriId">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Kategori Adı</label>
                            <input type="text" class="form-control" id="kategoriAdi" placeholder="Örn: Elektronik">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Üst Kategori (Opsiyonel)</label>
                            <div id="ustKategoriContainer" class="d-flex flex-column gap-2"></div>
                            <input type="hidden" id="ustKategoriId" value="">
                        </div>
                        <button type="button" id="btnKategoriKaydet"
                            class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Ekle ve Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="kurallarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3 bg-light">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-list-check text-primary me-2"></i>
                        <span id="kuralModalKategoriAdi">Kategori Kuralları</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="aktifKuralKategoriId">
                    
                    <!-- Yeni Kural Ekleme Formu -->
                    <div class="card bg-light border-0 mb-4 rounded-3">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3 text-muted small text-uppercase">Yeni Kural Ekle</h6>
                            <form id="yeniKuralFormu">
                                <div class="row">
                                    <!-- Left Column -->
                                    <div class="col-md-5 pe-md-4">
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-muted">Kural Adı / Özellik</label>
                                            <input type="text" class="form-control form-control-sm" id="kuralAd" placeholder="Örn: RAM_GB">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-muted">Ait Olduğu Yer</label>
                                            <select class="form-select form-select-sm" id="kuralTargetLevel">
                                                <option value="Product">Katalog (Ürün)</option>
                                                <option value="Asset">Ekipman (Cihaz)</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-muted">Veri Tipi & Görsel</label>
                                            <select class="form-select form-select-sm" id="kuralTip">
                                                <optgroup label="Yazı (Text)">
                                                    <option value="text">Düz Metin (TextBox)</option>
                                                    <option value="autocomplete">Otomatik Tamamlama (Autocomplete)</option>
                                                    <option value="masked_textbox">Maskeli Metin (IMEI vb.)</option>
                                                </optgroup>
                                                <optgroup label="Sayısal (Number)">
                                                    <option value="number">Tam Sayı (Integer)</option>
                                                    <option value="decimal">Ondalıklı Sayı (Decimal)</option>
                                                    <option value="range_slider_integer">Kaydırıcı (Range Slider - Tam Sayı)</option>
                                                    <option value="range_slider_decimal">Kaydırıcı (Range Slider - Ondalık)</option>
                                                </optgroup>
                                                <optgroup label="Seçim (Select)">
                                                    <option value="dropdown">Açılır Liste (Dropdown)</option>
                                                    <option value="icon_dropdown">İkonlu Liste (Icon + Dropdown)</option>
                                                    <option value="searchable_dropdown">Aramalı Liste (Searchable Dropdown)</option>
                                                    <option value="radio">Tekli Seçim (Radio Button)</option>
                                                    <option value="segmented_button">Segmentli Buton (Segmented Button)</option>
                                                    <option value="checkbox_group">Çoklu Seçim (Checkbox Group)</option>
                                                    <option value="color_picker">Renk Seçici (Color Picker + Etiket)</option>
                                                </optgroup>
                                                <optgroup label="Mantıksal (Boolean)">
                                                    <option value="toggle_switch">Aç-Kapat (Toggle Switch)</option>
                                                    <option value="boolean">Onay Kutusu (Checkbox)</option>
                                                </optgroup>
                                                <optgroup label="Tarih & Zaman (Date/Time)">
                                                    <option value="date">Tarih (Date Picker)</option>
                                                    <option value="datetime">Tarih & Saat (Datetime Picker)</option>
                                                </optgroup>
                                            </select>
                                        </div>
                                        <!-- BAĞLAMSAL (INLINE) ÖNİZLEME -->
                                        <div class="mb-3 p-3 bg-white border rounded shadow-sm d-none" id="inlinePreviewBox">
                                            <div class="mb-2"><span class="badge bg-info text-dark"><i class="bi bi-eye"></i> Örnek UI Görünümü</span></div>
                                            <div id="inlinePreviewContent" class="w-100"></div>
                                        </div>
                                        <div class="row g-2 mb-3">
                                            <div class="col-6 d-none" id="kuralMinDiv">
                                                <label class="form-label small fw-bold text-muted">Min. Değer</label>
                                                <input type="number" class="form-control form-control-sm" id="kuralMin" step="any">
                                            </div>
                                            <div class="col-6 d-none" id="kuralMaxDiv">
                                                <label class="form-label small fw-bold text-muted">Max. Değer</label>
                                                <input type="number" class="form-control form-control-sm" id="kuralMax" step="any">
                                            </div>
                                        </div>

                                        <div class="mb-3 d-flex align-items-center">
                                            <div class="form-check form-switch m-0">
                                                <input class="form-check-input cursor-pointer" type="checkbox" id="kuralZorunlu">
                                                <label class="form-check-label small fw-bold text-muted cursor-pointer" for="kuralZorunlu">Zorunlu</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input cursor-pointer" type="checkbox" id="kuralIsFeatured">
                                                <label class="form-check-label small fw-bold text-muted cursor-pointer" for="kuralIsFeatured">Detay Ekranında Öne Çıkar</label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Right Column -->
                                    <div class="col-md-7 border-start ps-md-4">
                                        <div id="kuralSeceneklerWrapper" class="d-none h-100">
                                            <div class="d-flex h-100 flex-column" id="kuralSeceneklerDiv">
                                                <label class="form-label small fw-bold text-muted">Seçenekler</label>
                                                <div class="input-group input-group-sm position-relative mb-3">
                                                    <input type="text" class="form-control" id="kuralSecenekYeniDeger" placeholder="Örn: Siyah" autocomplete="off">
                                                    <button type="button" class="btn btn-outline-primary fw-bold" id="btnSecenekEkle">
                                                        <i class="bi bi-plus-lg"></i> Ekle
                                                    </button>
                                                    <!-- Renk tipinde arama önerileri buraya açılır -->
                                                    <div id="renkOneriKutusu" class="dropdown-menu w-100 d-none scrollable-dropdown"></div>
                                                </div>

                                            <div class="d-flex justify-content-between align-items-center mb-2" id="kuralSeceneklerTopluIslem">
                                                <label class="form-label small fw-bold text-muted mb-0">Seçenekler Listesi</label>
                                                <div class="form-check form-switch m-0">
                                                    <input class="form-check-input cursor-pointer" type="checkbox" role="switch" id="switchTumunuSec" checked>
                                                    <label class="form-check-label small text-muted user-select-none cursor-pointer" for="switchTumunuSec">Tümünü Seç</label>
                                                </div>
                                            </div>

                                            <ul class="list-group list-group-flush rounded border scrollable-list mb-2"
                                                id="kuralSecenekListesi">
                                            </ul>                                                
                                            <!-- JS ile doldurulacak, boşken gizli -->
                                            <input type="hidden" id="kuralSecenekler">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                                    <button type="button" id="btnKuralEkle" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">
                                        Güncelle
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Mevcut Kurallar Tablosu -->
                    <h6 class="fw-bold mb-2 text-muted small text-uppercase">Tanımlı Kurallar (Şablonlar)</h6>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 border rounded">
                            <thead class="table-light text-muted small">
                                <tr>
                                    <th class="w-40px text-center"></th>
                                    <th>Ait Olduğu Yer</th>
                                    <th>Özellik Adı</th>
                                    <th>UI & Tip</th>
                                    <th>Zorunluluk</th>
                                    <th class="text-end">İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="kurallarTabloGovdesi">
                                <!-- JS ile Doldurulacak -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/partials/sidebar.partial.js"></script>
    <script src="js/partials/topbar.partial.js"></script>
    <script src="js/partials/pagination.partial.js"></script>
    <script src="js/security-utils.js"></script>
    <script src="js/table-utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/color-names.js"></script>
    <script src="js/dynamic-ui.js"></script>
    <script src="js/categories.js?v=4"></script>
    <script src="js/auth.js"></script>
</body>

</html>
