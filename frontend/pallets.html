<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletler - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/style.css?v=nb-40" rel="stylesheet">
    <script src="js/theme.js?v=nb-40"></script>
    <script src="js/shell-boot.js?v=nb-40"></script>
</head>
<body>
    <div class="container-fluid px-0 px-md-1 my-2">
        <div class="row g-2">
            <!-- SOL PANEL: FİLTRELER -->
            <div class="col-12 col-md-4 col-lg-3">
                <div class="card border-0 shadow-sm rounded-3 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-primary me-2"></i>Filtreler</h6>
                        <button type="button" id="btnFiltreleriTemizle" class="btn btn-sm btn-link text-decoration-none text-muted p-0">Temizle</button>
                    </div>
                    <div class="card-body p-3 pt-2">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Hızlı Ara</label>
                            <div class="position-relative d-flex align-items-center">
                                <span class="position-absolute ms-3 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="aramaKutusu" class="form-control form-control-sm rounded-pill ps-5 pe-5 py-2 bg-light border-0" placeholder="SSCC, Açıklama...">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SAĞ PANEL: LİSTE VE TABLO -->
            <div class="col-12 col-md-8 col-lg-9">
                <div class="card border-0 shadow-sm rounded-3 min-vh-75 h-100">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h6 class="fw-bold mb-0 text-muted">Palet Listesi</h6>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 border-top">
                                <thead>
                                    <tr class="text-muted small text-uppercase">
                                        <th class="user-select-none py-3">SSCC / Barkod</th>
                                        <th class="user-select-none py-3">Depo</th>
                                        <th class="user-select-none py-3">Açıklama</th>
                                        <th class="user-select-none py-3">Tarih</th>
                                    </tr>
                                </thead>
                                <tbody id="paletTablosuGovdesi">
                                </tbody>
                            </table>
                        </div>
                        <div id="paginationContainer" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PALET DETAY MODALI (Pencere) -->
    <div class="modal fade" id="paletDetayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow rounded-3">
                <div class="modal-header border-bottom-0 rounded-top-3">
                    <h5 class="modal-title fw-bold"><i class="bi bi-box-seam me-2"></i>Palet Detayı</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body px-4 py-3 bg-light">
                    <div id="palletError" class="alert alert-danger d-none"></div>
                    <div id="palletLoading" class="text-center py-5 d-none">
                        <div class="spinner-border text-primary" role="status"></div>
                        <div class="mt-2 text-muted">Yükleniyor...</div>
                    </div>

                    <div id="palletDetails" class="d-none">
                        <div class="card shadow-sm border-0 mb-3">
                            <div class="card-body">
                                <h5 class="card-title text-primary"><i class="bi bi-upc-scan me-2"></i>SSCC: <span id="lblSscc"></span></h5>
                                <p class="card-text text-muted mb-1"><strong>Depo:</strong> <span id="lblWarehouse"></span></p>
                                <p class="card-text text-muted mb-0"><strong>Açıklama:</strong> <span id="lblDescription"></span></p>
                            </div>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                                <h6 class="fw-bold mb-0"><i class="bi bi-list-check text-primary me-2"></i>İçerik Listesi</h6>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover table-borderless align-middle mb-0">
                                        <thead class="table-light text-muted small text-uppercase">
                                            <tr>
                                                <th class="ps-4">Kod</th>
                                                <th>Ürün Adı</th>
                                                <th>Lot / Parti</th>
                                                <th class="text-end pe-4">Miktar</th>
                                            </tr>
                                        </thead>
                                        <tbody id="palletContentsTable">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scriptler -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js?v=nb-40"></script>
    <script src="js/auth-check.js?v=nb-40"></script>
    <script src="js/notifications.js?v=nb-40"></script>
    <script src="js/modal-window.js?v=nb-40"></script>
    <script src="js/security-utils.js?v=nb-40"></script>
    <script src="js/data-view-engine.js?v=nb-40"></script>
    <script src="js/pallets.js?v=nb-40"></script>
</body>
</html>
