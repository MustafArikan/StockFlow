global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "default-receiver"
    # Örnek: Telegram bot ile bildirim (kendi bot token/chat_id değerlerinizi girin)
    telegram_configs:
      - bot_token: "TELEGRAM_BOT_TOKEN_BURAYA"
        chat_id: 123456789
        message: '{{ .CommonAnnotations.summary }}: {{ .CommonAnnotations.description }}'
