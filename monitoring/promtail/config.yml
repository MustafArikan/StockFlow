server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx_access_log
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access_log
          __path__: /var/log/nginx/access_loki.log

  - job_name: nginx_error_log
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_error_log
          __path__: /var/log/nginx/error_loki.log
