log_format loki '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" $request_time';

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    access_log /var/log/nginx/access_loki.log loki;
    error_log /var/log/nginx/error_loki.log;

    # --- Prometheus nginx-exporter için iç istatistik endpoint'i ---
    # SADECE Docker iç ağından (nginx-exporter container'ından) erişime izin verilir.
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # Docker default bridge/compose network aralığı
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Tarayıcının otomatik istediği favicon için sessiz cevap (konsolu 404 ile kirletmesin)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Backend API için Reverse Proxy
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ÖNEMLİ: proxy_pass'te sabit bir sunucu adı yazılırsa nginx bu adı YALNIZCA
        # başlangıçta bir kez çözer. Backend konteyneri yeniden başlayıp yeni bir IP
        # aldığında nginx eski IP'ye gitmeye devam eder ve tüm /api istekleri 502 döner.
        # Adresi bir değişken üzerinden vermek, Docker'ın iç DNS'i (127.0.0.11) ile
        # her istekte yeniden çözülmesini sağlar.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stokflow_api backend;
        proxy_pass http://$stokflow_api:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}