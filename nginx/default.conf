server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;

        # Content Security Policy (CSP) Header
        # CDN ve yerel API adresleri güvenli kaynaklar olarak beyaz listededir.
        add_header Content-Security-Policy "default-src 'self'; 
        script-src 'self' http://localhost:5136 http://localhost:5000 https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
        connect-src 'self' http://localhost:5136 http://localhost:5000 https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; 
        img-src 'self' data:;" always;
    }
}
